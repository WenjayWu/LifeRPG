name: Backup LifeRPG Data

on:
  schedule:
    # 每天北京时间凌晨 3:00 运行（UTC 19:00）
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Export from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd sync
          python export-from-supabase.py          

      - name: Upload backup artifacts
        uses: actions/upload-artifact@v4
        with:
          name: liferpg-backup-${{ github.run_id }}
          path: |
            records/
            data/history.json
            data/profile.json            
          retention-days: 90
